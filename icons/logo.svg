<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Brand Gradient (Electric Blue / Sapphire) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Clipboard Plate Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Top Clip Metal Gradient -->
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Soft drop shadow for squircle -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1d4ed8" flood-opacity="0.28"/>
    </filter>

    <!-- Shadow for floating sheets -->
    <filter id="sheetShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 1. Vibrant Brand Squircle (Transparent Outer Canvas) -->
  <g filter="url(#squircleShadow)">
    <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#brandGrad)"/>
  </g>

  <!-- Inner border highlight for glass polish -->
  <rect x="34" y="34" width="444" height="444" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="3"/>

  <!-- 2. Back History Layer (The "Past" Sheet) -->
  <rect x="168" y="118" width="200" height="264" rx="18" fill="rgba(255, 255, 255, 0.35)" transform="rotate(7 268 250)"/>

  <!-- 3. Front White Clipboard Body -->
  <g filter="url(#sheetShadow)">
    <rect x="136" y="128" width="240" height="280" rx="22" fill="url(#boardGrad)"/>
  </g>

  <!-- 4. Top Fastener Clip -->
  <!-- Metal clip bracket -->
  <rect x="196" y="104" width="120" height="44" rx="10" fill="url(#clipGrad)"/>
  <rect x="230" y="86" width="52" height="26" rx="8" fill="#1e40af"/>
  <rect x="242" y="94" width="28" height="10" rx="4" fill="#ffffff" opacity="0.8"/>

  <!-- 5. Content Lines (Representing Clips & Snippets) -->
  <!-- Line 1: Primary active clip (Blue) -->
  <rect x="172" y="184" width="115" height="14" rx="7" fill="#2563eb"/>
  <!-- Status green dot -->
  <circle cx="330" cy="191" r="7" fill="#10b981"/>

  <!-- Line 2: Body text line -->
  <rect x="172" y="218" width="168" height="12" rx="6" fill="#64748b"/>

  <!-- Line 3: Secondary text line -->
  <rect x="172" y="246" width="138" height="12" rx="6" fill="#94a3b8"/>

  <!-- Line 4: Code snippet box -->
  <rect x="172" y="276" width="168" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="186" y="290" width="95" height="10" rx="5" fill="#3b82f6"/>

  <!-- 6. History / Time Badge (Bottom Right Accent) -->
  <circle cx="328" cy="362" r="24" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/>
  <path d="M328 350 V362 H338" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>