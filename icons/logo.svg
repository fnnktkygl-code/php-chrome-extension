<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Primary Accent gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Subtle paper shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="4"/>

  <!-- Layer 1: Background History Card (The "Past" layer) -->
  <rect x="156" y="112" width="240" height="296" rx="20" fill="#334155" opacity="0.6" transform="rotate(7 276 260)"/>

  <!-- Layer 2: Main Front Clipboard Card -->
  <g filter="url(#cardShadow)">
    <rect x="126" y="128" width="260" height="304" rx="22" fill="#1e293b" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3"/>
  </g>

  <!-- Clipboard Top Clip Body -->
  <rect x="196" y="104" width="120" height="48" rx="12" fill="url(#primaryGrad)"/>
  <rect x="232" y="88" width="48" height="28" rx="8" fill="#3b82f6"/>

  <!-- Content Lines on Clipboard (representing clips/text) -->
  <!-- Line 1: Accent Header Line -->
  <rect x="166" y="188" width="130" height="14" rx="7" fill="#3b82f6"/>
  <!-- Category Dot -->
  <circle cx="332" cy="195" r="7" fill="#10b981"/>

  <!-- Line 2: Main text line -->
  <rect x="166" y="224" width="180" height="12" rx="6" fill="#e2e8f0"/>
  <!-- Line 3: Secondary text line -->
  <rect x="166" y="254" width="150" height="12" rx="6" fill="#94a3b8"/>
  <!-- Line 4: Code / command snippet line with background container -->
  <rect x="166" y="286" width="180" height="44" rx="8" fill="rgba(15, 23, 42, 0.7)"/>
  <rect x="180" y="302" width="120" height="11" rx="5.5" fill="#38bdf8"/>

  <!-- History / Time Icon Stamp at bottom right -->
  <circle cx="320" cy="382" r="24" fill="url(#primaryGrad)"/>
  <!-- Clock hands -->
  <path d="M320 370 V382 H330" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>