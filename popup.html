<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHP - Paste History Past</title>

  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="header">
    <div class="header-top">
      <div class="header-left">
        <img src="icons/logo.svg" alt="App Logo" class="header-logo">

        <h1>PHP - Paste History Past</h1>
        <span class="clip-count" id="clipCount">0</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="languageToggle" title="Language">🇬🇧</button>
        <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
        <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
        <button class="icon-btn" id="refreshBtn" title="Refresh">🔄</button>
        <button class="icon-btn" id="clearAll" title="Clear all">🗑️</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="all">
        <span class="tab-text">All</span>
        <span id="allCount" class="tab-count">0</span>
      </button>
      <button class="tab" data-tab="links">
        <span class="tab-text">Links</span>
        <span id="linksCount" class="tab-count">0</span>
      </button>
      <button class="tab" data-tab="pinned">
        <span class="tab-text">Pinned</span>
        <span id="pinnedCount" class="tab-count">0</span>
      </button>
    </div>

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search your clips...">
      <button class="clear-search" id="clearSearch">✕</button>
    </div>
    <div id="searchResults" class="search-results-count"></div>
  </div>

  <div class="clips-container" id="clipsContainer">
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Full Preview</div>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-text" id="modalText"></div>
    </div>
  </div>

  <div class="modal-overlay" id="settingsOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="settingsTitle">Settings</div>
        <button class="modal-close" id="settingsClose">✕</button>
      </div>
      <div class="modal-content">
        <div class="setting-item">
          <span id="saveUrlLabel">Save source URL</span>
          <label class="switch">
            <input type="checkbox" id="settingSaveUrl" checked>
            <span class="slider round"></span>
          </label>
        </div>
        <div class="setting-item">
          <span id="maxClipsLabel">Max clips limit</span>
          <select id="settingMaxClips" class="settings-select">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
            <option value="200">200</option>
          </select>
        </div>
        <div class="setting-item">
          <span id="maxAgeLabel">Clip retention period</span>
          <select id="settingMaxAge" class="settings-select">
            <option value="86400000" id="expiry1DayOpt">1 Day</option>
            <option value="604800000" id="expiry7DaysOpt">7 Days</option>
            <option value="2592000000" id="expiry30DaysOpt">30 Days</option>
            <option value="0" id="expiryNeverOpt">Never</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="copied-toast" id="copiedToast">
    <span>✓ Copied to clipboard</span>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>

</html>
